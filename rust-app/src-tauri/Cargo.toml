[package]
name = "rust-app"
version = "0.2.2"
description = "Samaritan Torah Search — desktop (Tauri)"
authors = ["Samaritan Torah Search"]
edition = "2021"

[lib]
name = "rust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
search-engine = { path = "../search-engine" }
