# Build GitHub Releases for the web zip + desktop installers.
#
# Cut a release:
#   git tag v0.2.1
#   git push origin v0.2.1
#
# Or run manually from Actions → Release → Run workflow (enter tag like v0.2.1).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/publish (e.g. v0.2.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-zip:
    name: Web deploy zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: pip install -r requirements.txt
      - run: npm ci
      - run: ./scripts/make_release.sh
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: release/*.zip
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit / GTK deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rust-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust-app -> target

      - name: Install frontend deps
        working-directory: rust-app
        run: npm ci

      - name: Build Tauri bundles
        working-directory: rust-app
        run: npm run tauri:build

      - name: Collect Windows installers
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p desktop-out
          find rust-app/target/release/bundle -type f \( -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp -v {} desktop-out/ \;
          ls -la desktop-out

      - name: Collect Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p desktop-out
          find rust-app/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp -v {} desktop-out/ \;
          ls -la desktop-out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop-out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [web-zip, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like v0.2.1 (got: $TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag $TAG"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p dist-assets
          find artifacts -type f -print -exec cp -v {} dist-assets/ \;
          # GitHub also attaches automatic Source code zip/tar.gz for the tag.
          ls -lah dist-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          NOTES=$(printf '%s\n' \
            "## Samaritan Torah Search ${TAG}" \
            "" \
            "### Assets" \
            "- **Web deploy zip** — built SPA + Python API + SQLite index (unzip and run \`./start.sh\`)" \
            "- **Windows** — NSIS \`.exe\` installer and/or MSI" \
            "- **Linux** — \`.deb\` and AppImage" \
            "- **Source** — attached automatically by GitHub (\`Source code (zip)\` / tar.gz)" \
            "" \
            "Desktop builds include the search index; no Python required at runtime.")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-assets/* --clobber
          else
            gh release create "$TAG" dist-assets/* \
              --title "Samaritan Torah Search ${TAG}" \
              --notes "$NOTES" \
              --target "$TARGET_SHA"
          fi
